<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Workloop</title>
  <style>
    /* ===== Design Tokens (light) ===== */
    :root {
      --bg: #f7f8fa;
      --bg-elevated: #ffffff;
      --surface: #f1f3f5;
      --surface-hover: #e9ecef;
      --surface-active: #e3e6ea;
      --border: #e3e6ea;
      --border-strong: #d0d5dd;
      --text: #1a1d23;
      --text-2: #4a5159;
      --text-muted: #6b7280;
      --text-dim: #9ca3af;
      --accent: #6366f1;
      --accent-bright: #4f46e5;
      --accent-light: #eef2ff;
      --accent-glow: rgba(99,102,241,.12);
      --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --gradient-soft: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 100%);
      --green: #059669;
      --green-light: #ecfdf5;
      --amber: #d97706;
      --amber-light: #fffbeb;
      --red: #e0354b;
      --red-light: #fef2f2;
      --violet: #7c3aed;
      --violet-light: #f5f3ff;
      --blue: #1d4ed8;
      --blue-light: #eff6ff;
      --cyan: #0891b2;
      --cyan-light: #ecfeff;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --shadow-xs: 0 1px 2px rgba(0,0,0,.04);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.04);
      --shadow-lg: 0 10px 24px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.03);
      --shadow-xl: 0 18px 48px rgba(0,0,0,.12);
      --font: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "JetBrains Mono", "Fira Code", ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    }

    /* ===== Design Tokens (dark) ===== */
    .dark {
      --bg: #08080c;
      --bg-elevated: #0e0e14;
      --surface: rgba(255,255,255,.03);
      --surface-hover: rgba(255,255,255,.06);
      --surface-active: rgba(255,255,255,.09);
      --border: rgba(255,255,255,.07);
      --border-strong: rgba(255,255,255,.12);
      --text: #f4f4f5;
      --text-2: #d4d4d8;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent: #818cf8;
      --accent-bright: #a5b4fc;
      --accent-light: rgba(129,140,248,.12);
      --accent-glow: rgba(129,140,248,.25);
      --gradient: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
      --gradient-soft: linear-gradient(135deg, rgba(129,140,248,.08) 0%, rgba(192,132,252,.08) 100%);
      --green: #34d399;
      --green-light: rgba(52,211,153,.12);
      --amber: #fbbf24;
      --amber-light: rgba(251,191,36,.12);
      --red: #fb7185;
      --red-light: rgba(251,113,133,.12);
      --violet: #c084fc;
      --violet-light: rgba(192,132,252,.12);
      --blue: #60a5fa;
      --blue-light: rgba(96,165,250,.12);
      --cyan: #22d3ee;
      --cyan-light: rgba(34,211,238,.12);
    }

    /* ===== Base ===== */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.55 var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv02","cv03","cv04","cv11";
      letter-spacing: -.01em;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { border: 0; cursor: pointer; background: transparent; }
    a { color: var(--accent-bright); text-decoration: none; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible,
    [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-xs); }
    * { border-color: var(--border); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    /* ===== App Shell ===== */
    .app-shell { display: flex; height: 100vh; overflow: hidden; }

    /* ===== Sidebar ===== */
    .sidebar {
      display: flex; flex-direction: column; width: 264px; shrink: 0;
      background: var(--bg-elevated); border-right: 1px solid var(--border);
    }
    .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 20px 20px 16px; }
    .brand-mark {
      width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px;
      background: var(--gradient); color: #fff; font-weight: 800; font-size: 15px;
      box-shadow: var(--shadow-md); flex: none;
    }
    .sidebar-brand strong { font-size: 15px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
    .sidebar-brand span { display: block; font-size: 11px; color: var(--text-dim); font-weight: 400; }

    .sidebar-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 16px 12px; }
    .metric {
      display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border); transition: background .15s;
    }
    .metric:hover { background: var(--surface-hover); }
    .metric-label { font-size: 11px; color: var(--text-dim); font-weight: 500; }
    .metric-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); letter-spacing: -.02em; }
    .metric.attention .metric-value { color: var(--amber); }
    .metric.problem .metric-value { color: var(--red); }
    .metric.ready .metric-value { color: var(--green); }

    .side-head { padding: 0 16px 10px; }
    .side-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .side-title h1 { font-size: 11px; margin: 0; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim); }
    .filter-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--surface); padding: 3px; border-radius: var(--radius-sm); }
    .filter-tabs button {
      border-radius: var(--radius-xs); padding: 6px 4px; font-size: 12px; font-weight: 500;
      color: var(--text-muted); transition: all .15s;
    }
    .filter-tabs button:hover { color: var(--text); background: var(--surface-hover); }
    .filter-tabs button.active { background: var(--bg-elevated); color: var(--accent-bright); box-shadow: var(--shadow-xs); }

    .task-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 8px; }
    .task-row {
      width: 100%; text-align: left; padding: 12px 16px; display: grid; gap: 6px;
      border-bottom: 1px solid var(--border); transition: background .12s; position: relative;
    }
    .task-row:hover { background: var(--surface-hover); }
    .task-row.selected { background: var(--accent-light); }
    .task-row.selected::before {
      content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 24px; border-radius: 0 3px 3px 0; background: var(--gradient);
    }
    .task-row-top { display: flex; align-items: flex-start; gap: 8px; }
    .task-row-title { font-weight: 500; min-width: 0; overflow-wrap: anywhere; flex: 1; color: var(--text); font-size: 13px; }
    .task-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--text-dim); font-size: 11px; }

    .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
    .sidebar-footer .status-card {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border);
    }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse-dot 2s ease-in-out infinite; flex: none; }
    @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .sidebar-footer .status-card span { font-size: 12px; font-weight: 500; color: var(--text-muted); }
    .sidebar-footer .status-card small { margin-left: auto; font-size: 10px; color: var(--text-dim); }

    /* ===== Main Area ===== */
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .main-header {
      display: flex; align-items: center; gap: 10px; padding: 0 24px; height: 56px; shrink: 0;
      background: var(--bg-elevated); border-bottom: 1px solid var(--border); z-index: 10;
    }
    .main-header-title { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -.01em; }
    .header-spacer { flex: 1; }

    /* ===== Buttons ===== */
    .top-btn, .icon-btn {
      min-height: 34px; border-radius: var(--radius-sm); background: var(--bg-elevated); color: var(--text-2);
      border: 1px solid var(--border-strong); padding: 7px 14px; font-size: 13px; font-weight: 500;
      transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
    }
    .top-btn:hover, .icon-btn:hover { background: var(--surface-hover); color: var(--text); border-color: var(--text-dim); }
    .icon-btn { width: 34px; padding: 0; font-size: 16px; justify-content: center; }
    .primary {
      background: var(--accent); color: #fff; border: 1px solid var(--accent);
      box-shadow: 0 1px 2px var(--accent-glow);
    }
    .primary:hover { background: var(--accent-bright); border-color: var(--accent-bright); color: #fff; }
    .danger { background: var(--red); color: #fff; border: 1px solid var(--red); }
    .danger:hover { background: #c92a3e; border-color: #c92a3e; color: #fff; }
    .dark .danger:hover { background: #e5526a; border-color: #e5526a; }
    .quiet { background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--text-2); }
    .quiet:hover { background: var(--surface-hover); color: var(--text); }
    .cmd {
      min-height: 34px; padding: 7px 14px; border-radius: var(--radius-sm); font-size: 13px;
      font-weight: 500; border: 1px solid transparent; transition: all .15s;
      display: inline-flex; align-items: center; gap: 6px;
    }

    /* ===== Status Pills ===== */
    .status {
      display: inline-flex; align-items: center; gap: 5px; min-height: 20px; padding: 2px 9px;
      border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap;
      color: var(--text-muted); background: var(--surface);
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; flex: none; }
    .status.running, .status.queued { color: var(--blue); background: var(--blue-light); }
    .status.human, .status.paused { color: var(--amber); background: var(--amber-light); }
    .status.failed, .status.blocked { color: var(--red); background: var(--red-light); }
    .status.ready, .status.delivered { color: var(--green); background: var(--green-light); }
    .status.running::before, .status.queued::before { animation: pulse-dot 1.5s ease-in-out infinite; }

    /* ===== Workspace ===== */
    .workspace { flex: 1; overflow-y: auto; background: var(--bg); }
    .empty {
      height: 100%; display: grid; place-items: center; color: var(--text-dim); font-size: 14px;
    }
    .detail { max-width: 1080px; margin: 0 auto; padding: 28px 32px 80px; }
    .detail-head { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
    .mobile-back { display: none; }
    .detail-title { min-width: 0; flex: 1; }
    .detail-title h2 { font-size: 24px; line-height: 1.25; margin: 0 0 6px; overflow-wrap: anywhere; font-weight: 600; letter-spacing: -.02em; }
    .detail-title p { margin: 0; color: var(--text-muted); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; align-items: flex-start; }
    .resolution {
      max-width: 320px; padding: 10px 13px; border-left: 3px solid var(--amber);
      background: var(--amber-light); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .resolution strong, .resolution span { display: block; }
    .resolution strong { font-size: 13px; color: var(--amber); }
    .resolution span { margin-top: 3px; color: var(--amber); font-size: 12px; opacity: .85; }

    /* ===== Pipeline (stepper) ===== */
    .pipeline {
      display: grid; gap: 0; margin: 0 0 22px; background: var(--bg-elevated);
      border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow-xs);
    }
    .stage { position: relative; min-height: 74px; padding: 14px 10px 11px; border-right: 1px solid var(--border); text-align: center; }
    .stage:last-child { border-right: 0; }
    .stage::before {
      content: ""; position: absolute; left: 50%; top: 13px; transform: translateX(-50%);
      width: 14px; height: 14px; border-radius: 50%; background: var(--bg-elevated);
      border: 2px solid var(--border-strong); transition: all .2s;
    }
    .stage.done::before { background: var(--green); border-color: var(--green); }
    .stage.current::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
    .stage strong { display: block; font-size: 12px; font-weight: 500; margin-top: 22px; color: var(--text-muted); }
    .stage span { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .stage.current strong, .stage.done strong { color: var(--text); font-weight: 600; }
    .stage.stage-planner::before { border-color: var(--amber); }
    .stage.stage-plan_approval::before { border-color: var(--accent); }
    .stage.stage-executor::before { border-color: var(--green); }
    .stage.stage-validation::before { border-color: var(--cyan); }
    .stage.stage-reviewer::before { border-color: var(--violet); }
    .stage.stage-delivery::before { border-color: var(--text-dim); }

    /* ===== Alerts & Sections ===== */
    .alert {
      padding: 12px 14px; border-left: 3px solid var(--amber); background: var(--amber-light);
      margin-bottom: 18px; overflow-wrap: anywhere; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 13px; color: var(--amber);
    }
    .alert.error { border-color: var(--red); background: var(--red-light); color: var(--red); }
    .section {
      padding: 20px 22px; background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 14px; box-shadow: var(--shadow-xs);
    }
    .section:first-of-type { margin-top: 0; }
    .section h3 {
      font-size: 14px; margin: 0 0 14px; font-weight: 600; letter-spacing: -.01em;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text);
    }
    .section h3 span {
      font-size: 11px; font-weight: 600; color: var(--text-muted); background: var(--surface);
      padding: 3px 9px; border-radius: 999px;
    }
    .section h4 {
      font-size: 11px; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-dim); font-weight: 600;
    }
    .kv { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 10px 16px; margin: 0; }
    .kv dt { color: var(--text-muted); font-size: 13px; }
    .kv dd { margin: 0; overflow-wrap: anywhere; font-size: 13px; color: var(--text); }
    .kv code, code {
      font: 12px var(--mono); background: var(--surface); padding: 2px 6px; border-radius: 4px;
      color: var(--accent-bright);
    }
    .compact-list { margin: 0; padding-left: 18px; color: var(--text-2); }
    .compact-list li { margin: 3px 0; }
    details summary { cursor: pointer; color: var(--accent-bright); font-weight: 600; font-size: 13px; margin: 8px 0; }
    details summary:hover { text-decoration: underline; }

    /* ===== Code & Tables ===== */
    pre {
      margin: 0; padding: 14px 16px; overflow: auto; max-height: 460px;
      background: #0f1117; color: #d4d7de; border-radius: var(--radius-sm); font: 12.5px/1.6 var(--mono);
      white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid #1e222b;
    }
    .diff-add { color: #4ade80; } .diff-del { color: #f87171; } .diff-head { color: #60a5fa; }
    table {
      width: 100%; border-collapse: collapse; font-size: 13px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); overflow: hidden;
    }
    th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
    th { background: var(--surface); color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--surface-hover); }
    .pass { color: var(--green); font-weight: 700; } .fail { color: var(--red); font-weight: 700; }

    /* ===== Events timeline ===== */
    .event-list { display: grid; gap: 0; border-left: 2px solid var(--border); margin-left: 8px; }
    .event {
      position: relative; display: grid; grid-template-columns: 100px 120px minmax(0, 1fr);
      gap: 12px; padding: 8px 12px 8px 18px; font-size: 12px;
    }
    .event::before {
      content: ""; position: absolute; left: -7px; top: 14px; width: 12px; height: 12px;
      border-radius: 50%; background: var(--bg-elevated); border: 2px solid var(--violet);
    }
    .event small { color: var(--text-dim); }
    .event strong { color: var(--text); font-weight: 600; }
    .event span { color: var(--text-2); }

    /* ===== Dialogs ===== */
    dialog {
      width: min(560px, calc(100vw - 28px)); border: 1px solid var(--border); border-radius: 16px;
      padding: 0; box-shadow: var(--shadow-xl); background: var(--bg-elevated); color: var(--text);
    }
    dialog::backdrop { background: rgba(8,8,12,.55); backdrop-filter: blur(4px); }
    .dialog-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px; border-bottom: 1px solid var(--border);
    }
    .dialog-head h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
    .dialog-body { padding: 22px; display: grid; gap: 14px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--border); }
    label { display: grid; gap: 6px; font-weight: 500; font-size: 13px; color: var(--text); }
    label span { font-size: 12px; color: var(--text-muted); font-weight: 400; }
    input, textarea, select {
      width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      padding: 9px 12px; background: var(--bg-elevated); color: var(--text);
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    textarea { min-height: 100px; resize: vertical; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .runtime-grid { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .runtime-grid > div { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .runtime-grid > div:nth-last-child(-n+3) { border-bottom: 0; }
    .workflow-list { display: grid; border-top: 1px solid var(--border); margin-bottom: 4px; }
    .workflow-section-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; }
    .workflow-section-head strong { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); }
    .workflow-section-head .cmd { min-height: 28px; padding: 4px 12px; font-size: 12px; }
    .workflow-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center; }
    .workflow-row strong { font-size: 13px; font-weight: 600; }
    .workflow-row strong, .workflow-row span { overflow-wrap: anywhere; }
    .workflow-row span { color: var(--text-muted); font-size: 12px; }
    .workflow-row .cmd { min-height: 28px; padding: 4px 12px; font-size: 12px; }
    .node-list { display: grid; gap: 8px; }
    .node-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; display: grid; gap: 8px; background: var(--surface); transition: border-color .15s, box-shadow .15s; }
    .node-row:hover { border-color: var(--border-strong); }
    .node-row.dragging { opacity: .5; border-style: dashed; }
    .node-row.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .node-row-head { display: flex; align-items: center; gap: 8px; }
    .node-row-head .drag-handle { cursor: grab; color: var(--text-dim); font-size: 14px; padding: 2px; flex: none; user-select: none; }
    .node-row-head .drag-handle:active { cursor: grabbing; }
    .node-row-head select { width: auto; min-width: 90px; flex: none; padding: 5px 8px; font-size: 12px; }
    .node-row-head input { flex: 1; min-width: 0; }
    .node-row-head .node-actions { display: flex; gap: 4px; flex: none; }
    .node-row-head .node-actions button { width: 28px; height: 28px; min-height: 28px; padding: 0; font-size: 14px; justify-content: center; border-radius: var(--radius-xs); }
    .node-kind { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex: none; }
    .node-kind.kind-planner { color: var(--amber); background: var(--amber-light); }
    .node-kind.kind-plan_approval { color: var(--accent-bright); background: var(--accent-light); }
    .node-kind.kind-executor { color: var(--green); background: var(--green-light); }
    .node-kind.kind-validation { color: var(--cyan); background: var(--cyan-light); }
    .node-kind.kind-reviewer { color: var(--violet); background: var(--violet-light); }
    .node-kind.kind-delivery { color: var(--text-dim); background: var(--surface); }
    .node-row label { font-size: 12px; color: var(--text-2); }
    .node-row textarea { min-height: 48px; font-size: 12px; }
    .node-add-zone { display: flex; justify-content: center; padding: 8px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); }
    .node-add-zone button { gap: 6px; }
    .health-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); margin-right: 6px; }
    .health-dot.ok { background: var(--green); } .health-dot.bad { background: var(--red); }

    /* ===== Toast & utilities ===== */
    .toast {
      position: fixed; right: 20px; bottom: 20px; max-width: 400px; padding: 12px 16px;
      border-radius: var(--radius-sm); background: var(--bg-elevated); color: var(--text);
      border: 1px solid var(--border); box-shadow: var(--shadow-lg); z-index: 50; font-size: 13px;
    }
    .hidden { display: none !important; }

    /* ===== Skip link ===== */
    .skip-link {
      position: fixed; left: 12px; top: -60px; z-index: 100; padding: 8px 12px;
      background: var(--bg-elevated); color: var(--text); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
    }
    .skip-link:focus { top: 10px; }

    /* ===== Theme toggle ===== */
    .theme-toggle {
      width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
      background: var(--bg-elevated); display: grid; place-items: center; font-size: 16px;
      transition: all .15s; color: var(--text-2);
    }
    .theme-toggle:hover { background: var(--surface-hover); color: var(--text); border-color: var(--text-dim); }

    /* ===== Responsive ===== */
    @media (max-width: 900px) {
      .sidebar { width: 220px; }
      .sidebar-metrics { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 768px) {
      .app-shell { flex-direction: column; }
      .sidebar { width: 100%; height: auto; max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--border); }
      .sidebar-metrics { grid-template-columns: repeat(4, 1fr); }
      .metric { padding: 6px 8px; }
      .metric-value { font-size: 14px; }
      .task-list { max-height: none; }
      .app-shell.has-selection .sidebar { display: none; }
      .mobile-back { display: inline-flex; align-items: center; align-self: start; }
      .detail { padding: 16px 14px 60px; }
      .detail-head { display: grid; }
      .actions { justify-content: flex-start; }
      .pipeline { overflow-x: auto; }
      .kv { grid-template-columns: 1fr; gap: 3px; } .kv dd { margin-bottom: 7px; }
      .event { grid-template-columns: 90px 1fr; } .event > :last-child { grid-column: 1 / -1; }
      .form-grid { grid-template-columns: 1fr; }
      .runtime-grid { grid-template-columns: 90px 1fr; }
      .runtime-grid > div:nth-child(3n) { grid-column: 2; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#workspace">跳到任务详情</a>

  <div class="app-shell" id="app">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">W</div>
        <div>
          <strong>Workloop</strong>
          <span>任务操作台</span>
        </div>
      </div>

      <div class="sidebar-metrics" id="metrics" role="status" aria-live="polite" aria-label="运行指标">
        <div class="metric">
          <span class="metric-label">运行</span>
          <span class="metric-value" id="metricRunning">0</span>
        </div>
        <div class="metric attention">
          <span class="metric-label">待处理</span>
          <span class="metric-value" id="metricWaiting">0</span>
        </div>
        <div class="metric problem">
          <span class="metric-label">异常</span>
          <span class="metric-value" id="metricProblems">0</span>
        </div>
        <div class="metric ready">
          <span class="metric-label">待交付</span>
          <span class="metric-value" id="metricReady">0</span>
        </div>
      </div>

      <div class="side-head">
        <div class="side-title">
          <h1>任务</h1>
          <button class="icon-btn quiet" id="projectButton" type="button" title="注册项目" aria-label="注册项目" style="min-height:28px;width:28px;font-size:14px;">＋</button>
        </div>
        <div class="filter-tabs" role="group" aria-label="任务筛选">
          <button type="button" data-filter="all" aria-pressed="true" class="active">全部</button>
          <button type="button" data-filter="attention" aria-pressed="false">待处理</button>
          <button type="button" data-filter="ready" aria-pressed="false">待交付</button>
        </div>
      </div>

      <div class="task-list" id="taskList" aria-live="polite"></div>

      <div class="sidebar-footer">
        <div class="status-card">
          <span class="pulse-dot"></span>
          <span>本地运行中</span>
          <small>v1.0</small>
        </div>
      </div>
    </aside>

    <!-- ===== Main Area ===== -->
    <div class="main-area">
      <header class="main-header">
        <button class="top-btn" id="runtimeButton" type="button">运行时</button>
        <button class="top-btn" id="workflowButton" type="button">工作流</button>
        <div class="header-spacer"></div>
        <button class="theme-toggle" id="themeToggle" type="button" title="切换主题" aria-label="切换主题">🌙</button>
        <button class="icon-btn" id="refreshButton" type="button" title="刷新" aria-label="刷新任务">↻</button>
        <button class="top-btn primary" id="newTaskButton" type="button">新建任务</button>
      </header>
      <section class="workspace" id="workspace" aria-live="polite"><div class="empty">暂无任务</div></section>
    </div>
  </div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <!-- ===== Dialogs ===== -->
  <dialog id="taskDialog" aria-labelledby="taskDialogTitle">
    <form method="dialog" id="taskForm">
      <div class="dialog-head"><h2 id="taskDialogTitle">新建任务</h2><button class="icon-btn quiet" value="cancel" aria-label="关闭">×</button></div>
      <div class="dialog-body">
        <label>项目<select id="taskProject" required></select></label>
        <label>工作流<select id="taskWorkflow" required></select></label>
        <label>标题<input id="taskTitle" required maxlength="160"></label>
        <label>需求<textarea id="taskRequirement" required></textarea></label>
        <details><summary>预算</summary><div class="form-grid" style="margin-top:12px">
          <label>总时长（秒）<input id="taskTotal" type="number" min="1" value="7200"></label>
          <label>单次调用（秒）<input id="taskCall" type="number" min="1" value="1800"></label>
          <label>无事件（秒）<input id="taskIdle" type="number" min="1" value="120"></label>
          <label>最大轮次<input id="taskRounds" type="number" min="1" value="3"></label>
        </div></details>
      </div>
      <div class="dialog-actions"><button class="cmd quiet" value="cancel">取消</button><button class="cmd primary" type="submit" value="default">创建</button></div>
    </form>
  </dialog>

  <dialog id="projectDialog" aria-labelledby="projectDialogTitle">
    <form method="dialog" id="projectForm">
      <div class="dialog-head"><h2 id="projectDialogTitle">注册项目</h2><button class="icon-btn quiet" value="cancel" aria-label="关闭">×</button></div>
      <div class="dialog-body">
        <label>名称<input id="projectName" required maxlength="120"></label>
        <label>仓库目录<input id="projectPath" required></label>
        <div class="form-grid"><label>目标分支<input id="projectBranch" value="main"></label><label>项目配置<input id="projectConfig" value=".workloop/project.toml"></label></div>
      </div>
      <div class="dialog-actions"><button class="cmd quiet" value="cancel">取消</button><button class="cmd primary" type="submit" value="default">注册</button></div>
    </form>
  </dialog>

  <dialog id="runtimeDialog" aria-labelledby="runtimeDialogTitle">
    <div class="dialog-head"><h2 id="runtimeDialogTitle">运行时</h2><button class="icon-btn quiet" data-close="runtimeDialog" aria-label="关闭">×</button></div>
    <div class="dialog-body" id="runtimeBody"></div>
  </dialog>

  <dialog id="workflowDialog" aria-labelledby="workflowDialogTitle" style="width:min(720px,calc(100vw - 28px));max-height:calc(100vh - 56px);overflow-y:auto;">
    <form method="dialog" id="workflowForm">
      <div class="dialog-head"><h2 id="workflowDialogTitle">工作流</h2><button class="icon-btn quiet" value="cancel" aria-label="关闭">×</button></div>
      <div class="dialog-body">
        <div class="workflow-section-head"><strong>已有工作流</strong><button class="cmd primary" id="newWorkflowBtn" type="button">+ 新建</button></div>
        <div class="workflow-list" id="workflowList"></div>
        <div class="form-grid">
          <label>标识<input id="workflowId" required maxlength="64" pattern="[a-z][a-z0-9_-]{1,63}"></label>
          <label>名称<input id="workflowLabel" required maxlength="80"></label>
        </div>
        <label>说明<span>可选，简要描述该工作流的用途</span><input id="workflowDesc" maxlength="300" placeholder="例如：双轮执行 + 双轮验证"></label>
        <label>推进方式<select id="workflowMode"><option value="guarded">计划人工审批</option><option value="autopilot">计划自动推进</option></select></label>
        <div class="workflow-section-head"><strong>节点编排</strong><button class="cmd quiet" id="addNodeBtn" type="button">+ 添加节点</button></div>
        <div class="node-list" id="workflowNodes"></div>
      </div>
      <div class="dialog-actions"><button class="cmd quiet" value="cancel">取消</button><button class="cmd primary" type="submit" value="default">保存工作流</button></div>
    </form>
  </dialog>

  <dialog id="budgetDialog" aria-labelledby="budgetDialogTitle">
    <form method="dialog" id="budgetForm">
      <div class="dialog-head"><h2 id="budgetDialogTitle">调整预算</h2><button class="icon-btn quiet" value="cancel" aria-label="关闭">×</button></div>
      <div class="dialog-body form-grid">
        <label>总时长（秒）<input id="budgetTotal" type="number" min="1" required></label>
        <label>单次调用（秒）<input id="budgetCall" type="number" min="1" required></label>
        <label>无事件（秒）<input id="budgetIdle" type="number" min="1" required></label>
        <label>最大轮次<input id="budgetRounds" type="number" min="1" required></label>
        <label>费用上限（USD）<input id="budgetCost" type="number" min="0.01" step="0.01"></label>
      </div>
      <div class="dialog-actions"><button class="cmd quiet" value="cancel">取消</button><button class="cmd primary" type="submit" value="default">更新</button></div>
    </form>
  </dialog>

  <dialog id="clarificationDialog" aria-labelledby="clarificationDialogTitle">
    <form method="dialog" id="clarificationForm">
      <div class="dialog-head"><h2 id="clarificationDialogTitle">回答澄清</h2><button class="icon-btn quiet" value="cancel" aria-label="关闭">×</button></div>
      <div class="dialog-body">
        <p id="clarificationQuestion"></p>
        <label>答复<textarea id="clarificationAnswer" required></textarea></label>
      </div>
      <div class="dialog-actions"><button class="cmd quiet" value="cancel">取消</button><button class="cmd primary" type="submit" value="default">提交答复</button></div>
    </form>
  </dialog>

  <dialog id="deliveryDialog" aria-labelledby="deliveryDialogTitle">
    <form method="dialog" id="deliveryForm">
      <div class="dialog-head"><h2 id="deliveryDialogTitle">确认交付</h2><button class="icon-btn quiet" value="cancel" aria-label="关闭">×</button></div>
      <div class="dialog-body"><label>策略<select id="deliveryStrategy"><option value="merge">Merge</option><option value="cherry-pick">Cherry-pick</option></select></label></div>
      <div class="dialog-actions"><button class="cmd quiet" value="cancel">取消</button><button class="cmd danger" type="submit" value="default">确认交付</button></div>
    </form>
  </dialog>

  <script>
    const state = { tasks: [], projects: [], workflows: [], selected: null, detail: null, filter: "all", editingNodes: null };
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const labels = {
      queued_for_analysis:"排队分析", analyzing:"分析中", waiting_for_plan_approval:"待批准计划",
      queued_for_execution:"排队执行", queued_for_recovery:"排队恢复", executing:"执行中",
      validating:"验证中", reviewing:"审核中", replanning:"重新规划", interrupted:"已中断",
      paused:"已暂停", failed:"失败", blocked:"阻塞", integration_required:"待重新整合",
      integrating:"重新整合", ready_to_deliver:"待交付", delivered:"已交付", cancelled:"已取消", draft:"草稿"
    };
    const running = new Set(["queued_for_analysis","queued_for_execution","queued_for_recovery","analyzing","executing","validating","reviewing","replanning","integrating"]);
    const human = new Set(["waiting_for_plan_approval","interrupted","paused","integration_required"]);
    function statusClass(s) { if (running.has(s)) return s.startsWith("queued") ? "queued" : "running"; if (human.has(s)) return s === "paused" ? "paused" : "human"; if (["failed","blocked"].includes(s)) return s; if (["ready_to_deliver","delivered"].includes(s)) return s === "delivered" ? "delivered" : "ready"; return ""; }
    function fmtTime(value) { if (!value) return ""; const d = new Date(value); return Number.isNaN(d.valueOf()) ? value : d.toLocaleString([], {month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }
    async function api(path, options={}) { const response = await fetch(path, {headers:{"Content-Type":"application/json"}, ...options}); const data = await response.json(); if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`); return data; }
    const post = (path, body={}) => api(path, {method:"POST", body:JSON.stringify(body)});
    function toast(message) { const el=$("toast"); el.textContent=message; el.classList.remove("hidden"); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.add("hidden"),3600); }
    function filteredTasks() { if (state.filter === "attention") return state.tasks.filter(t => human.has(t.status) || ["failed","blocked"].includes(t.status)); if (state.filter === "ready") return state.tasks.filter(t => t.status === "ready_to_deliver"); return state.tasks; }
    function taskKey(t){return t.task_key||t.task_id;}
    function renderTasks() { const list=filteredTasks(); $("taskList").innerHTML=list.length ? list.map(t=>`<button type="button" class="task-row ${taskKey(t)===state.selected?"selected":""}" data-task="${esc(taskKey(t))}"><span class="task-row-top"><span class="task-row-title">${esc(t.title)}</span><span class="status ${statusClass(t.status)}">${esc(labels[t.status]||t.status)}</span></span><span class="task-meta"><span>${esc(t.read_only?"历史 · 只读":t.project_name||t.project_id)}</span><span>${t.queue_position?`队列 ${t.queue_position}`:fmtTime(t.updated_at)}</span></span></button>`).join("") : `<div class="empty" style="height:180px">当前筛选无任务</div>`; document.querySelectorAll("[data-task]").forEach(el=>el.onclick=()=>{const task=state.tasks.find(t=>taskKey(t)===el.dataset.task);selectTask(el.dataset.task,task?.detail_url)}); }
    async function loadProjects() { state.projects=await api("/api/agent/projects"); $("taskProject").innerHTML=state.projects.map(p=>`<option value="${esc(p.project_id)}">${esc(p.name)}</option>`).join(""); }
    async function loadWorkflows() { state.workflows=await api("/api/agent/workflows"); $("taskWorkflow").innerHTML=state.workflows.map(w=>`<option value="${esc(w.workflow_id)}">${esc(w.label)}</option>`).join(""); renderWorkflowList(); }
    function renderMetrics(metrics) { const tasks=metrics.tasks||{}; $("metricRunning").textContent=tasks.running||0; $("metricWaiting").textContent=tasks.waiting_for_human||0; $("metricProblems").textContent=(tasks.failed||0)+(tasks.blocked||0); $("metricReady").textContent=tasks.ready_to_deliver||0; }
    async function loadTasks(refreshDetail=false) { const [active,history,metrics]=await Promise.all([api("/api/agent/tasks"),api("/api/agent/history"),api("/api/agent/metrics")]); state.tasks=[...active,...history]; renderTasks(); renderMetrics(metrics); if (state.selected && refreshDetail){const task=state.tasks.find(t=>taskKey(t)===state.selected);if(task)await loadDetail(state.selected,task.detail_url);} }
    async function selectTask(key,detailUrl) { state.selected=key; location.hash=encodeURIComponent(key); $("app").classList.add("has-selection"); renderTasks(); await loadDetail(key,detailUrl); }
    function workflowNodes(detail) { return detail.workflow?.nodes?.length ? detail.workflow.nodes : [{kind:"planner",label:"Claude 规划"},{kind:"plan_approval",label:"批准计划"},{kind:"executor",label:"Codex 执行"},{kind:"validation",label:"确定性验证"},{kind:"reviewer",label:"Claude 审核"},{kind:"delivery",label:"确认交付"}]; }
    function activeNode(detail,nodes) { if(detail.status==="delivered")return nodes.length; if(["draft","queued_for_analysis","analyzing","replanning"].includes(detail.status)){const planner=nodes.findIndex(n=>n.kind==="planner");return planner<0?0:planner;} if(Number.isInteger(detail.workflow_cursor)&&detail.workflow_cursor>0)return Math.min(detail.workflow_cursor,nodes.length-1); const kind={waiting_for_plan_approval:"plan_approval",queued_for_execution:"executor",executing:"executor",validating:"validation",integrating:"validation",reviewing:"reviewer",integration_required:"delivery",ready_to_deliver:"delivery"}[detail.status]||"planner"; const found=nodes.findIndex(n=>n.kind===kind); return found<0?0:found; }
    function pipeline(detail) { const nodes=workflowNodes(detail), active=activeNode(detail,nodes); return `<div class="pipeline" style="grid-template-columns:repeat(${nodes.length},minmax(80px,1fr))" aria-label="任务阶段">${nodes.map((node,i)=>{const stage=i<active?"done":i===active?"current":"";return `<div class="stage stage-${esc(node.kind)} ${stage}"${stage==="current"?' aria-current="step"':""}><strong>${esc(node.label)}</strong><span>${esc(node.kind)}</span></div>`}).join("")}</div>`; }
    function actionButton(a) { if (a.manual) return `<div class="resolution"><strong>${esc(a.label)}</strong><span>${esc(a.description)}</span></div>`; const cls=a.requires_confirmation?"danger":a.id==="approve"||a.id==="prepare_delivery"||a.id==="clarify"?"primary":"quiet"; return `<button class="cmd ${cls}" data-action="${esc(a.id)}"${a.description?` title="${esc(a.description)}"`:""}>${esc(a.label)}</button>`; }
    function renderPlan(plan,clarifications=[]) { if (!plan || plan.available===false) return ""; return `<section class="section"><h3>计划</h3><dl class="kv"><dt>需求理解</dt><dd>${esc(plan.requirement_understanding)}</dd><dt>实施步骤</dt><dd><ol class="compact-list">${(plan.steps||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></dd><dt>验收标准</dt><dd><ul class="compact-list">${(plan.acceptance_criteria||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></dd><dt>必须测试</dt><dd>${(plan.required_tests||[]).map(esc).join("、")}</dd><dt>风险</dt><dd>${(plan.risks||[]).map(esc).join("；")||"无"}</dd>${plan.open_questions?.length?`<dt>待澄清</dt><dd>${plan.open_questions.map(esc).join("；")}</dd>`:""}${clarifications.length?`<dt>澄清记录</dt><dd>${clarifications.map(x=>`${esc(x.question)}<br><strong>${esc(x.answer)}</strong>`).join("<br>")}</dd>`:""}</dl></section>`; }
    function colorDiff(diff) { return esc(diff).split("\n").map(line=>`<span class="${line.startsWith("+")&&!line.startsWith("+++")?"diff-add":line.startsWith("-")&&!line.startsWith("---")?"diff-del":line.startsWith("@@")?"diff-head":""}">${line}</span>`).join("\n"); }
    function renderRounds(rounds) { if (!rounds?.length) return ""; const latest=rounds[rounds.length-1]; let html=`<section class="section"><h3>变更与验证 <span>第 ${esc(latest.round)} 轮</span></h3>`; if(latest.diff) html+=`<h4>Diff</h4><pre>${colorDiff(latest.diff)}</pre>`; if(latest.validation) html+=`<h4>确定性验证</h4><table><thead><tr><th>检查</th><th>结果</th><th>输出</th></tr></thead><tbody>${(latest.validation.checks||[]).map(c=>`<tr><td>${esc(c.name||c.command)}</td><td class="${c.exit_code===0&&!c.error?"pass":"fail"}">${c.exit_code===0&&!c.error?"通过":"失败"}</td><td>${esc(c.error||c.stdout||"")}</td></tr>`).join("")}</tbody></table>`; if(latest.review) html+=`<h4>独立审核</h4><p><span class="status ${latest.review.verdict==="pass"?"ready":"human"}">${esc(latest.review.verdict)}</span> ${esc(latest.review.summary||"")}</p>${(latest.review.issues||[]).length?`<table><thead><tr><th>位置</th><th>问题</th><th>建议</th></tr></thead><tbody>${latest.review.issues.map(i=>`<tr><td>${esc(i.file)}:${esc(i.line)}</td><td>${esc(i.message)}</td><td>${esc(i.suggestion)}</td></tr>`).join("")}</tbody></table>`:""}`; if(rounds.length>1) html+=`<details><summary>历史轮次（${rounds.length-1}）</summary>${rounds.slice(0,-1).map(r=>`<h4>第 ${esc(r.round)} 轮 · ${esc(r.review?.verdict||(r.validation?.passed===false?"未通过":"完成"))}</h4>${r.diff?`<pre>${colorDiff(r.diff)}</pre>`:""}`).join("")}</details>`; return html+`</section>`; }
    function renderEvents(runs) { const events=[]; (runs||[]).forEach(run=>(run.events||[]).forEach(e=>events.push({...e,run_role:run.role}))); if(!events.length) return ""; return `<section class="section"><h3>运行事件</h3><div class="event-list">${events.slice(-80).map(e=>`<div class="event"><small>${esc(fmtTime(e.at))}</small><strong>${esc(e.run_role||e.role)}</strong><span>${esc(e.event_type)}${e.raw_type?` · ${esc(e.raw_type)}`:""}</span></div>`).join("")}</div></section>`; }
    function renderReport(r) { if(!r || r.available===false) return ""; return `<section class="section"><h3>DeliveryReport</h3><dl class="kv"><dt>任务提交</dt><dd><code>${esc(r.task_commit)}</code></dd><dt>目标提交</dt><dd><code>${esc(r.target_commit)}</code></dd><dt>修改文件</dt><dd>${(r.modified_files||[]).map(esc).join("、")}</dd><dt>审核</dt><dd>${esc(r.review_summary)}</dd><dt>已知风险</dt><dd>${(r.known_risks||[]).map(esc).join("；")||"无"}</dd><dt>人工后续</dt><dd>${(r.human_next_steps||[]).map(esc).join("；")}</dd></dl></section>`; }
    function renderBudget(d) { const b=d.budget||{}; return `<section class="section"><h3>运行身份与预算</h3><dl class="kv"><dt>任务分支</dt><dd><code>${esc(d.task_branch)}</code></dd><dt>基线</dt><dd><code>${esc(d.base_commit)}</code></dd><dt>Session</dt><dd>${Object.entries(d.sessions||{}).map(([k,v])=>`${esc(k)}: <code>${esc(v)}</code>`).join("<br>")||"无"}</dd><dt>活动时间</dt><dd>${Number(b.consumed_active_seconds||0).toFixed(2)} / ${esc(b.total_timeout_seconds)} 秒</dd><dt>费用</dt><dd>$${Number(b.consumed_cost_usd||0).toFixed(4)}${b.max_cost_usd!=null?` / $${esc(b.max_cost_usd)}`:""}</dd><dt>轮次</dt><dd>${esc(d.plan_iteration)} / ${esc(b.max_iterations)}</dd></dl></section>`; }
    function renderLegacyArtifact(name,item){if(!item?.available)return `<dt>${esc(name)}</dt><dd class="fail">${esc(item?.error||"不可用")}</dd>`;const content=typeof item.content==="string"?item.content:JSON.stringify(item.content,null,2);return `<dt>${esc(name)}</dt><dd><pre>${esc(content)}</pre></dd>`;}
    function renderLegacy(d){const artifacts=Object.entries(d.artifacts||{}).map(([name,item])=>renderLegacyArtifact(name,item)).join("");const plan=renderLegacyArtifact("计划",d.plan);return `<article class="detail"><div class="detail-head"><button class="cmd quiet mobile-back" id="backButton" type="button">← 任务</button><div class="detail-title"><h2>${esc(d.title)}</h2><p>历史工作流 · 只读 · <span class="status">${esc(d.status)}</span></p></div><div class="actions"><button class="cmd danger" data-action="delete" title="删除任务">删除</button></div></div><div class="alert">此任务由 legacy-v1 工作流创建，仅保留只读审计视图。新执行请创建 Agent Runtime 任务。</div><section class="section"><h3>历史任务</h3><dl class="kv"><dt>目标</dt><dd>${esc(d.goal)}</dd><dt>迭代</dt><dd>${esc(d.iteration)}</dd>${plan}${artifacts}</dl></section></article>`;}
    async function loadDetail(key,detailUrl) { try { const d=await api(detailUrl||`/api/agent/tasks/${encodeURIComponent(key)}`); state.detail=d; if(d.read_only){$("workspace").innerHTML=renderLegacy(d);}else{const alert=d.error?`<div class="alert ${["failed","blocked"].includes(d.status)?"error":""}" role="alert">${esc(d.error)}</div>`:""; $("workspace").innerHTML=`<article class="detail"><div class="detail-head"><button class="cmd quiet mobile-back" id="backButton" type="button">← 任务</button><div class="detail-title"><h2>${esc(d.title)}</h2><p>${esc(d.project_name)} · ${esc(d.workflow?.label||"标准审批")} · <span class="status ${statusClass(d.status)}">${esc(labels[d.status]||d.status)}</span></p></div><div class="actions" aria-label="当前可用操作">${(d.actions||[]).map(actionButton).join("")}<button class="cmd danger" data-action="delete" title="删除任务">删除</button></div></div>${pipeline(d)}${alert}${renderPlan(d.plan,d.clarifications)}${renderRounds(d.rounds)}${renderEvents(d.runs)}${renderReport(d.delivery_report)}${renderBudget(d)}</article>`;} $("backButton").onclick=()=>{$("app").classList.remove("has-selection");state.selected=null;location.hash="";renderTasks();}; document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>runAction(b.dataset.action)); } catch(e){ toast(e.message); } }
    async function runAction(action) { const id=state.selected; try { if(action==="approve") await post(`/api/agent/tasks/${id}/approve`); else if(action==="clarify") return openClarification(); else if(action==="resume"||action==="rerun") await post(`/api/agent/tasks/${id}/${action}`); else if(action==="terminate"){if(!confirm("确认终止任务？"))return;await post(`/api/agent/tasks/${id}/terminate`);} else if(action==="prepare_delivery") await post(`/api/agent/tasks/${id}/prepare-delivery`); else if(action==="integrate") await post(`/api/agent/tasks/${id}/integrate`); else if(action==="update_budget") return openBudget(); else if(action==="deliver") return $("deliveryDialog").showModal(); else if(action==="delete"){if(!confirm("确认删除该任务？此操作不可撤销。"))return;const d=state.detail||{};const rid=d.task_id||id;await post(d.read_only?`/api/agent/history/${encodeURIComponent(rid)}/delete`:`/api/agent/tasks/${encodeURIComponent(rid)}/delete`);toast("任务已删除");state.selected=null;state.detail=null;location.hash="";$("app").classList.remove("has-selection");$("workspace").innerHTML='<div class="empty">暂无任务</div>';await loadTasks();return;} toast("操作已提交"); await loadTasks(true); } catch(e){toast(e.message);} }
    function openClarification(){const action=(state.detail.actions||[]).find(x=>x.id==="clarify");$("clarificationQuestion").textContent=action?.description||state.detail.plan?.open_questions?.[0]||"";$("clarificationAnswer").value="";$("clarificationDialog").showModal();$("clarificationAnswer").focus();}
    function openBudget(){const b=state.detail.budget;$("budgetTotal").value=b.total_timeout_seconds;$("budgetCall").value=b.call_timeout_seconds;$("budgetIdle").value=b.idle_timeout_seconds;$("budgetRounds").value=b.max_iterations;$("budgetCost").value=b.max_cost_usd??"";$("budgetDialog").showModal();}
    async function showRuntime(){ $("runtimeDialog").showModal(); $("runtimeBody").innerHTML="加载中"; try{const d=await api("/api/agent/runtime-health");const health=d.health||{};$("runtimeBody").innerHTML=`<div class="runtime-grid"><div><strong>角色</strong></div><div><strong>Runtime / Model</strong></div><div><strong>状态</strong></div>${Object.entries(d.profiles||{}).map(([role,p])=>{const h=health[role]||health;const ok=h.available===true;return `<div>${esc(role)}</div><div>${esc(p.runtime)} · ${esc(p.model||"default")}</div><div><span class="health-dot ${ok?"ok":"bad"}"></span>${ok?"可用":esc(h.error||"不可用")}</div>`}).join("")}</div>${d.worker_error?`<div class="alert error">${esc(d.worker_error)}</div>`:""}`;}catch(e){$("runtimeBody").textContent=e.message;} }
    const NODE_KINDS=[{kind:"planner",label:"规划",defaultLabel:"Claude 规划"},{kind:"plan_approval",label:"审批",defaultLabel:"批准计划"},{kind:"executor",label:"执行",defaultLabel:"Codex 执行"},{kind:"validation",label:"验证",defaultLabel:"确定性验证"},{kind:"reviewer",label:"审核",defaultLabel:"Claude 审核"},{kind:"delivery",label:"交付",defaultLabel:"确认交付"}];
    const kindLabels=Object.fromEntries(NODE_KINDS.map(k=>[k.kind,k.label]));
    const kindDefaultLabels=Object.fromEntries(NODE_KINDS.map(k=>[k.kind,k.defaultLabel]));
    function defaultWorkflowNodes(approval){const nodes=[{node_id:"plan",kind:"planner",label:"Claude 规划",instructions:""}];if(approval)nodes.push({node_id:"approve",kind:"plan_approval",label:"批准计划",instructions:""});nodes.push({node_id:"execute",kind:"executor",label:"Codex 执行",instructions:""},{node_id:"validate",kind:"validation",label:"确定性验证",instructions:""},{node_id:"review",kind:"reviewer",label:"Claude 审核",instructions:""},{node_id:"deliver",kind:"delivery",label:"确认交付",instructions:""});return nodes;}
    function generateNodeId(kind,index){return`${kind}_${Date.now().toString(36)}_${index}`;}
    function renderNodeEditor(){const container=$("workflowNodes");if(!state.editingNodes||!state.editingNodes.length){container.innerHTML='<div class="node-add-zone" style="border-style:dashed;padding:16px;color:var(--text-dim);">还没有节点，点击下方按钮添加</div>';return;}container.innerHTML=state.editingNodes.map((n,i)=>{const kindOpts=NODE_KINDS.map(k=>`<option value="${k.kind}"${k.kind===n.kind?" selected":""}>${k.label}</option>`).join("");const canMoveUp=i>0;const canMoveDown=i<state.editingNodes.length-1;const canDelete=state.editingNodes.length>2;return `<div class="node-row" data-node-index="${i}" draggable="true"><div class="node-row-head"><span class="drag-handle" title="拖拽排序">⠿</span><span class="node-kind kind-${esc(n.kind)}">${esc(kindLabels[n.kind]||n.kind)}</span><select class="node-kind-select" data-node-index="${i}" title="节点类型">${kindOpts}</select><input class="node-label" data-node-index="${i}" value="${esc(n.label)}" maxlength="80" placeholder="节点名称"><div class="node-actions"><button class="cmd quiet" type="button" data-move-up="${i}"${canMoveUp?"":" disabled"} title="上移">▲</button><button class="cmd quiet" type="button" data-move-down="${i}"${canMoveDown?"":" disabled"} title="下移">▼</button><button class="cmd danger" type="button" data-remove-node="${i}"${canDelete?"":" disabled"} title="删除节点">✕</button></div></div><label>附加指令<span>可选，为该节点添加额外执行要求</span><textarea class="node-instr" data-node-index="${i}" maxlength="4000" placeholder="例如：只修改 src/ 目录下的文件，不要触碰测试文件">${esc(n.instructions||"")}</textarea></label></div>`;}).join("");container.querySelectorAll(".node-kind-select").forEach(sel=>{sel.onchange=e=>{const idx=+e.target.dataset.nodeIndex;const newKind=e.target.value;state.editingNodes[idx].kind=newKind;const badge=e.target.closest(".node-row").querySelector(".node-kind");badge.className=`node-kind kind-${newKind}`;badge.textContent=kindLabels[newKind]||newKind;};});container.querySelectorAll("[data-move-up]").forEach(btn=>{btn.onclick=()=>{const idx=+btn.dataset.moveUp;gatherNodeValues();const tmp=state.editingNodes[idx-1];state.editingNodes[idx-1]=state.editingNodes[idx];state.editingNodes[idx]=tmp;renderNodeEditor();};});container.querySelectorAll("[data-move-down]").forEach(btn=>{btn.onclick=()=>{const idx=+btn.dataset.moveDown;gatherNodeValues();const tmp=state.editingNodes[idx+1];state.editingNodes[idx+1]=state.editingNodes[idx];state.editingNodes[idx]=tmp;renderNodeEditor();};});container.querySelectorAll("[data-remove-node]").forEach(btn=>{btn.onclick=()=>{const idx=+btn.dataset.removeNode;gatherNodeValues();state.editingNodes.splice(idx,1);renderNodeEditor();};});let dragSrcIdx=null;container.querySelectorAll(".node-row").forEach(row=>{row.addEventListener("dragstart",e=>{dragSrcIdx=+row.dataset.nodeIndex;row.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(dragSrcIdx));});row.addEventListener("dragend",()=>{row.classList.remove("dragging");container.querySelectorAll(".node-row").forEach(r=>r.classList.remove("drag-over"));});row.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";row.classList.add("drag-over");});row.addEventListener("dragleave",()=>row.classList.remove("drag-over"));row.addEventListener("drop",e=>{e.preventDefault();const targetIdx=+row.dataset.nodeIndex;if(dragSrcIdx===null||dragSrcIdx===targetIdx)return;gatherNodeValues();const[moved]=state.editingNodes.splice(dragSrcIdx,1);state.editingNodes.splice(targetIdx,0,moved);renderNodeEditor();dragSrcIdx=null;});});}
    function gatherNodeValues(){if(!state.editingNodes)return;document.querySelectorAll(".node-label").forEach(el=>{const idx=+el.dataset.nodeIndex;if(state.editingNodes[idx])state.editingNodes[idx].label=el.value;});document.querySelectorAll(".node-instr").forEach(el=>{const idx=+el.dataset.nodeIndex;if(state.editingNodes[idx])state.editingNodes[idx].instructions=el.value;});document.querySelectorAll(".node-kind-select").forEach(el=>{const idx=+el.dataset.nodeIndex;if(state.editingNodes[idx])state.editingNodes[idx].kind=el.value;});}
    function addWorkflowNode(){gatherNodeValues();const insertIdx=state.editingNodes.length-1;const newKind="executor";const newId=generateNodeId(newKind,state.editingNodes.length);state.editingNodes.splice(insertIdx,0,{node_id:newId,kind:newKind,label:kindDefaultLabels[newKind],instructions:""});renderNodeEditor();}
    function onWorkflowModeChange(){gatherNodeValues();const approval=$("workflowMode").value==="guarded";const hasApproval=state.editingNodes.some(n=>n.kind==="plan_approval");if(approval&&!hasApproval){const idx=state.editingNodes.findIndex(n=>n.kind==="planner");state.editingNodes.splice(idx+1,0,{node_id:"approve",kind:"plan_approval",label:"批准计划",instructions:""});}else if(!approval&&hasApproval){state.editingNodes=state.editingNodes.filter(n=>n.kind!=="plan_approval");}renderNodeEditor();}
    function openWorkflowDialog(workflowId){if(workflowId){const w=state.workflows.find(x=>x.workflow_id===workflowId);if(!w||w.builtin)return;$("workflowDialogTitle").textContent="编辑工作流";$("workflowId").value=w.workflow_id;$("workflowLabel").value=w.label;$("workflowDesc").value=w.description||"";$("workflowMode").value=w.nodes.some(n=>n.kind==="plan_approval")?"guarded":"autopilot";state.editingNodes=w.nodes.map(n=>({...n}));}else{$("workflowDialogTitle").textContent="新建工作流";$("workflowId").value="";$("workflowLabel").value="";$("workflowDesc").value="";$("workflowMode").value="guarded";state.editingNodes=defaultWorkflowNodes(true);}renderNodeEditor();const dlg=$("workflowDialog");if(!dlg.open)dlg.showModal();}
    function renderWorkflowList(){if(!$("workflowList"))return;$("workflowList").innerHTML=state.workflows.map(w=>`<div class="workflow-row"><strong>${esc(w.label)}${w.builtin?' <small style="color:var(--text-dim);font-weight:400;font-size:11px;">内置</small>':""}</strong><span>${esc(w.nodes.map(n=>n.label).join(" → "))}</span><div style="display:flex;gap:4px;">${w.builtin?"":`<button class="cmd quiet" data-edit-workflow="${esc(w.workflow_id)}">编辑</button><button class="cmd danger" data-delete-workflow="${esc(w.workflow_id)}" title="删除工作流">删除</button>`}</div></div>`).join("");document.querySelectorAll("[data-edit-workflow]").forEach(b=>b.onclick=()=>openWorkflowDialog(b.dataset.editWorkflow));document.querySelectorAll("[data-delete-workflow]").forEach(b=>b.onclick=async()=>{if(!confirm("确认删除该工作流？此操作不可撤销。"))return;try{const res=await fetch(`/api/agent/workflows/${encodeURIComponent(b.dataset.deleteWorkflow)}`,{method:"DELETE"});if(!res.ok){const e=await res.json();throw new Error(e.error||"删除失败");}await loadWorkflows();toast("工作流已删除");}catch(e){toast(e.message);}});}
    function workflowPayload(){gatherNodeValues();return{workflow_id:$("workflowId").value,label:$("workflowLabel").value,description:$("workflowDesc").value,nodes:state.editingNodes.map(n=>{const node={node_id:n.node_id,kind:n.kind,label:n.label};if(n.instructions)node.instructions=n.instructions;return node;})};}

    /* ---- Theme toggle ---- */
    function applyTheme(theme){document.documentElement.classList.toggle("dark",theme==="dark");$("themeToggle").textContent=theme==="dark"?"☀️":"🌙";}
    applyTheme(localStorage.getItem("workloop-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
    $("themeToggle").onclick=()=>{const next=document.documentElement.classList.contains("dark")?"light":"dark";localStorage.setItem("workloop-theme",next);applyTheme(next);};

    document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>{x.classList.toggle("active",x===b);x.setAttribute("aria-pressed",x===b?"true":"false")});renderTasks();});
    document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).close());
    document.querySelectorAll('dialog button[value="cancel"]').forEach(b=>{b.type="button";b.onclick=()=>b.closest("dialog").close();});
    $("refreshButton").onclick=()=>loadTasks(true).catch(e=>toast(e.message)); $("runtimeButton").onclick=showRuntime; $("workflowButton").onclick=()=>openWorkflowDialog(null); $("workflowMode").onchange=onWorkflowModeChange; $("newWorkflowBtn").onclick=()=>openWorkflowDialog(null); $("addNodeBtn").onclick=addWorkflowNode; $("projectButton").onclick=()=>$("projectDialog").showModal();
    $("newTaskButton").onclick=async()=>{if(!state.projects.length){$("projectDialog").showModal();return;}$("taskDialog").showModal();};
    $("projectForm").onsubmit=async e=>{if(e.submitter?.value==="cancel")return;e.preventDefault();try{await post("/api/agent/projects",{name:$("projectName").value,repository:$("projectPath").value,default_branch:$("projectBranch").value,config_path:$("projectConfig").value});$("projectDialog").close();await loadProjects();toast("项目已注册");}catch(err){toast(err.message);}};
    $("taskForm").onsubmit=async e=>{if(e.submitter?.value==="cancel")return;e.preventDefault();try{const task=await post("/api/agent/tasks",{project_id:$("taskProject").value,workflow_id:$("taskWorkflow").value,title:$("taskTitle").value,requirement:$("taskRequirement").value,budget:{total_timeout_seconds:+$("taskTotal").value,call_timeout_seconds:+$("taskCall").value,idle_timeout_seconds:+$("taskIdle").value,max_iterations:+$("taskRounds").value}});$("taskDialog").close();await loadTasks();await selectTask(task.task_id);}catch(err){toast(err.message);}};
    $("workflowForm").onsubmit=async e=>{if(e.submitter?.value==="cancel")return;e.preventDefault();try{const saved=await post("/api/agent/workflows",workflowPayload());await loadWorkflows();$("taskWorkflow").value=saved.workflow_id;$("workflowDialog").close();toast("工作流已保存");}catch(err){toast(err.message);}};
    $("budgetForm").onsubmit=async e=>{if(e.submitter?.value==="cancel")return;e.preventDefault();try{await post(`/api/agent/tasks/${state.selected}/budget`,{total_timeout_seconds:+$("budgetTotal").value,call_timeout_seconds:+$("budgetCall").value,idle_timeout_seconds:+$("budgetIdle").value,max_iterations:+$("budgetRounds").value,max_cost_usd:$("budgetCost").value?+$("budgetCost").value:null});$("budgetDialog").close();await loadTasks(true);}catch(err){toast(err.message);}};
    $("clarificationForm").onsubmit=async e=>{if(e.submitter?.value==="cancel")return;e.preventDefault();try{await post(`/api/agent/tasks/${state.selected}/clarify`,{answer:$("clarificationAnswer").value});$("clarificationDialog").close();await loadTasks(true);toast("澄清已提交");}catch(err){toast(err.message);}};
    $("deliveryForm").onsubmit=async e=>{if(e.submitter?.value==="cancel")return;e.preventDefault();try{await post(`/api/agent/tasks/${state.selected}/deliver`,{strategy:$("deliveryStrategy").value,confirmed:true});$("deliveryDialog").close();await loadTasks(true);toast("交付完成");}catch(err){toast(err.message);}};
    window.addEventListener("hashchange",()=>{const key=decodeURIComponent(location.hash.slice(1));if(key&&key!==state.selected){const task=state.tasks.find(t=>taskKey(t)===key);if(task)selectTask(key,task.detail_url);}});
    async function init(){try{await Promise.all([loadProjects(),loadWorkflows(),loadTasks()]);const key=decodeURIComponent(location.hash.slice(1));const task=state.tasks.find(t=>taskKey(t)===key);if(task)await selectTask(key,task.detail_url);}catch(e){toast(e.message);}}
    init(); setInterval(()=>loadTasks(Boolean(state.selected)).catch(()=>{}),4000);
  </script>
</body>
</html>
